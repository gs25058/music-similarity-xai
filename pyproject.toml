[build-system]
requires = ["setuptools>=64,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "music-similarity-xai"
version = "0.1.0"
description = "Time-localized music similarity with grounded Korean explanations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<2", "scipy>=1.10", "soundfile>=0.10", "torch==2.6.0", "pretty_midi==0.2.10", "PyYAML>=6", "setuptools>=64,<81"]

[project.optional-dependencies]
encoders = ["transformers==4.38.2", "huggingface_hub>=0.25,<1", "einops>=0.6"]
test = ["pytest>=7"]

[project.scripts]
music-xai = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
